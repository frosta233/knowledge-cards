# JVM settings for the Gradle daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Djava.net.preferIPv4Stack=true
# Use JDK 21 (Gradle 8.x/AGP 8.x fully support it)
org.gradle.parallel=true
org.gradle.caching=true

# More tolerant HTTP settings for flaky connections to dl.google.com
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.connectionRetryCount=6

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# KSP2 (required by Room 2.8)
ksp.useKSP2=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
